services:
  # ============================================================================
  # 1. Laravel Application (PHP 8.3 FPM)
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sipuda-app:latest
    container_name: sipuda_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sipuda_net

  # ============================================================================
  # 2. Web Server (Nginx)
  # ============================================================================
  web:
    image: nginx:alpine
    container_name: sipuda_web
    restart: unless-stopped
    # Port diikat ke 127.0.0.1 agar aman di balik Nginx Host / Cloudflare Tunnel
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_app:/var/www/html/storage/app:ro
    depends_on:
      - app
    networks:
      - sipuda_net

  # ============================================================================
  # 3. Database (MariaDB 11)
  # ============================================================================
  db:
    image: mariadb:11
    container_name: sipuda_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-presensi_ubudiyah}
      MYSQL_USER: ${DB_USERNAME:-sipuda_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sipuda_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-sipuda_root_secret}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - sipuda_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================================
  # 4. Laravel Scheduler (Cron / Background Worker)
  # ============================================================================
  scheduler:
    image: sipuda-app:latest
    container_name: sipuda_scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - .env
    depends_on:
      - app
      - db
    networks:
      - sipuda_net

networks:
  sipuda_net:
    driver: bridge

volumes:
  db_data:
    driver: local
  storage_app:
    driver: local
  storage_logs:
    driver: local
